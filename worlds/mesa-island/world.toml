name = "Mesa World"
description = "A simple mesa world with a player and ground."
max_players = 1
afk_timeout = 0

[scripts]
main = "main.lua"
skill = "API.md"

[renderer]
name = "Mesa World Renderer"
mode = "module"
api_version = 1
entry = "dist/renderer.bundle.js"
capabilities = ["three-sdk"]

[observation]
radius = 40000

[agent_api]
vision = true

# Same world as the paper runs (mesa-small-world-3 on nacloos/mesa-island).
# Compatibility mode reproduces that engine's physics; see docs/physics.md.
[clawblox]
player_object_physics = false
