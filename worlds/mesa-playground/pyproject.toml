[project]
name = "mesa-world-analysis"
version = "0.1.0"
description = "Recording analysis utilities for mesa-world"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "zstandard>=0.23",
]

[project.scripts]
mesa-analyze-recording = "analyze_recording:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["analyze_recording"]
