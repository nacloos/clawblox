<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawblox Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css" />
    <style>
      :root {
        --bg: #080c10;
        --panel: #111a23;
        --panel-2: #152232;
        --line: #223444;
        --text: #dde8f2;
        --muted: #88a0b5;
        --accent: #2fe39d;
        --warn: #ffcf4a;
        --danger: #ff5e5e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "JetBrains Mono", "IBM Plex Sans", monospace;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 0%, #12334a 0%, transparent 30%),
          radial-gradient(circle at 90% 100%, #1d3a2f 0%, transparent 35%),
          linear-gradient(180deg, #070a0e 0%, #090f14 100%);
        min-height: 100vh;
      }
      .grid {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 12px;
        height: 100vh;
        padding: 12px;
      }
      .panel {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(20, 32, 43, 0.85), rgba(12, 21, 30, 0.9));
        border-radius: 14px;
        overflow: hidden;
        backdrop-filter: blur(3px);
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .body { padding: 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      input, select, button {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
        font: inherit;
      }
      button {
        background: linear-gradient(180deg, #1b5544, #153c31);
        border-color: #1f785f;
        cursor: pointer;
      }
      button.secondary {
        background: var(--panel-2);
        border-color: var(--line);
      }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
      .stat {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: rgba(11, 20, 28, 0.8);
      }
      .stat .k { font-size: 11px; color: var(--muted); }
      .stat .v { font-size: 18px; margin-top: 4px; }
      .events {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(8, 14, 20, 0.8);
        height: calc(100vh - 430px);
        overflow: auto;
        padding: 8px;
      }
      .event {
        border-left: 3px solid var(--line);
        padding: 6px 8px;
        margin-bottom: 6px;
        font-size: 12px;
        background: rgba(13, 21, 30, 0.8);
      }
      .event.chat { border-left-color: var(--accent); }
      .event.hurt, .event.death, .event.kicked { border-left-color: var(--danger); }
      .event.health { border-left-color: var(--warn); }
      #termWrap { height: calc(100vh - 46px); }
      #term { width: 100%; height: 100%; }
      .status-ok { color: var(--accent); }
      .status-bad { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="panel">
        <div class="head"><span>Clawblox Ops</span><span id="conn">offline</span></div>
        <div class="body">
          <label>Adapter HTTP (for ws + skill checks)</label>
          <input id="adapterHttp" placeholder="http://127.0.0.1:8081" />

          <label>Agent Session Token (X-Session)</label>
          <input id="sessionToken" placeholder="paste token from agent startup" />

          <div class="row">
            <button id="connectEvents">Connect Events</button>
            <button id="disconnectEvents" class="secondary">Disconnect</button>
          </div>

          <label>tmux Session</label>
          <select id="tmuxSession"></select>

          <div class="row">
            <button id="refreshTmux" class="secondary">Refresh tmux</button>
            <button id="connectTerm">Connect Terminal</button>
          </div>

          <label><input id="readonly" type="checkbox" checked style="width:auto; margin-right:6px;" /> Read-only terminal</label>

          <div class="stats">
            <div class="stat"><div class="k">Health</div><div class="v" id="health">-</div></div>
            <div class="stat"><div class="k">Food</div><div class="v" id="food">-</div></div>
            <div class="stat"><div class="k">Position</div><div class="v" id="pos">-</div></div>
            <div class="stat"><div class="k">Last Event</div><div class="v" id="lastEvt">-</div></div>
          </div>

          <div id="events" class="events"></div>
        </div>
      </div>

      <div class="panel">
        <div class="head"><span>Live tmux TUI</span><span id="termStatus">disconnected</span></div>
        <div id="termWrap"><div id="term"></div></div>
      </div>
    </div>

    <script type="module">
      import { Terminal } from "https://cdn.jsdelivr.net/npm/@xterm/xterm/+esm";
      import { FitAddon } from "https://cdn.jsdelivr.net/npm/@xterm/addon-fit/+esm";

      const adapterHttpInput = document.getElementById("adapterHttp");
      const sessionTokenInput = document.getElementById("sessionToken");
      const tmuxSessionSelect = document.getElementById("tmuxSession");
      const connEl = document.getElementById("conn");
      const termStatusEl = document.getElementById("termStatus");
      const eventsEl = document.getElementById("events");

      const healthEl = document.getElementById("health");
      const foodEl = document.getElementById("food");
      const posEl = document.getElementById("pos");
      const lastEvtEl = document.getElementById("lastEvt");

      const term = new Terminal({
        convertEol: true,
        cursorBlink: true,
        fontFamily: "JetBrains Mono, monospace",
        fontSize: 13,
        scrollback: 10000,
        theme: { background: "#0a1219", foreground: "#dce8f5" },
      });
      const fitAddon = new FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById("term"));
      fitAddon.fit();

      let eventsWs = null;
      let termWs = null;

      function appendEvent(type, data) {
        const el = document.createElement("div");
        el.className = `event ${type}`;
        const t = new Date().toLocaleTimeString();
        el.textContent = `[${t}] ${type}: ${JSON.stringify(data)}`;
        eventsEl.prepend(el);
        while (eventsEl.children.length > 120) eventsEl.removeChild(eventsEl.lastChild);
        lastEvtEl.textContent = type;
      }

      function updateStats(type, data) {
        if (type === "connected" || type === "health") {
          if (typeof data.health !== "undefined") healthEl.textContent = String(data.health);
          if (typeof data.food !== "undefined") foodEl.textContent = String(data.food);
        }
        if ((type === "connected" || type === "move") && data.pos) {
          posEl.textContent = `${Math.round(data.pos.x)}, ${Math.round(data.pos.y)}, ${Math.round(data.pos.z)}`;
        }
      }

      async function loadConfig() {
        const cfg = await fetch("/api/config").then((r) => r.json());
        adapterHttpInput.value = cfg.defaultAdapterHttp;
      }

      async function loadTmuxSessions() {
        const res = await fetch("/api/tmux/sessions").then((r) => r.json());
        const sessions = res.sessions || [];
        tmuxSessionSelect.innerHTML = "";
        for (const s of sessions) {
          const o = document.createElement("option");
          o.value = s;
          o.textContent = s;
          tmuxSessionSelect.appendChild(o);
        }
        if (!sessions.length) {
          const o = document.createElement("option");
          o.value = "mc-agent";
          o.textContent = "mc-agent";
          tmuxSessionSelect.appendChild(o);
        }
      }

      function connectEvents() {
        if (eventsWs) eventsWs.close();
        const token = sessionTokenInput.value.trim();
        if (!token) {
          appendEvent("error", { message: "Missing session token" });
          return;
        }
        const base = adapterHttpInput.value.trim().replace(/^http/, "ws");
        const wsUrl = `${base}/ws?session=${encodeURIComponent(token)}`;
        eventsWs = new WebSocket(wsUrl);
        eventsWs.onopen = () => {
          connEl.textContent = "events connected";
          connEl.className = "status-ok";
        };
        eventsWs.onclose = () => {
          connEl.textContent = "events disconnected";
          connEl.className = "status-bad";
        };
        eventsWs.onmessage = (e) => {
          try {
            const evt = JSON.parse(e.data);
            appendEvent(evt.type || "event", evt.data || {});
            updateStats(evt.type, evt.data || {});
          } catch {
            appendEvent("raw", { data: String(e.data).slice(0, 300) });
          }
        };
      }

      function connectTerminal() {
        if (termWs) termWs.close();
        const session = tmuxSessionSelect.value || "mc-agent";
        const ro = document.getElementById("readonly").checked;
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${proto}://${location.host}/term?session=${encodeURIComponent(session)}&readonly=${ro ? "1" : "0"}`;

        term.clear();
        term.writeln(`Connecting to tmux session '${session}'...`);

        termWs = new WebSocket(wsUrl);
        termWs.onopen = () => {
          termStatusEl.textContent = `${session} connected`;
          termStatusEl.className = "status-ok";
          const size = fitAddon.proposeDimensions();
          if (size) {
            termWs.send(JSON.stringify({ type: "resize", cols: size.cols, rows: size.rows }));
          }
        };
        termWs.onmessage = (e) => {
          if (typeof e.data === "string" && e.data.startsWith("{")) {
            try {
              const msg = JSON.parse(e.data);
              if (msg.type === "meta") return;
            } catch {}
          }
          term.write(e.data);
        };
        termWs.onclose = () => {
          termStatusEl.textContent = `${session} disconnected`;
          termStatusEl.className = "status-bad";
        };
      }

      term.onData((data) => {
        if (termWs && termWs.readyState === 1) {
          termWs.send(JSON.stringify({ type: "input", data }));
        }
      });

      window.addEventListener("resize", () => {
        fitAddon.fit();
        if (termWs && termWs.readyState === 1) {
          const size = fitAddon.proposeDimensions();
          if (size) termWs.send(JSON.stringify({ type: "resize", cols: size.cols, rows: size.rows }));
        }
      });

      document.getElementById("connectEvents").onclick = connectEvents;
      document.getElementById("disconnectEvents").onclick = () => eventsWs && eventsWs.close();
      document.getElementById("refreshTmux").onclick = loadTmuxSessions;
      document.getElementById("connectTerm").onclick = connectTerminal;

      await loadConfig();
      await loadTmuxSessions();
      connectTerminal();
    </script>
  </body>
</html>
